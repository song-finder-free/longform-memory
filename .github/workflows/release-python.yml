# Publish to PyPI via Trusted Publishing (OIDC) — no token, no secret, no 2FA.
#
# 🎉 与 npm 不同：**PyPI 支持 "pending publisher"** —— 项目还不存在就能先配好，
# 首次发布也走 OIDC，全程不需要任何凭据。
#
# 一次性设置（在 pypi.org 上做，**账号侧栏**不是项目侧栏，因为项目还不存在）：
#   Account settings → Publishing → Add a new pending publisher
#     PyPI Project Name : longform-memory
#     Owner             : song-finder-free
#     Repository name   : longform-memory
#     Workflow name     : release-python.yml   ← 必须与本文件名一字不差
#     Environment name  : （留空）
#
# ⚠️ pending publisher **不占名**：在你第一次发布之前，别人抢注同名项目会让它失效。
#    所以配完尽快发一次。
#
# 之后发布：
#   （改 python/pyproject.toml 的 version）
#   git tag py-v0.1.1 && git push --tags
#
# 🚨 硬要求：
#   - `id-token: write` 少了这一行，OIDC 换不到凭据
#   - tag 前缀是 `py-v`，与 npm 的 `v*` 分开，否则一个 tag 触发两条发布
#   - workflow 文件名改了必须回 pypi.org 同步改

name: Release (PyPI)

on:
  push:
    tags: ['py-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 是 pyproject 声明的下限 —— 测下限，否则那个声明没人验
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tag 与 pyproject 必须说同一个版本号。
      # 不校验的话，打错 tag 会发出意外版本，而发出去撤不回来。
      - name: Tag must match pyproject version
        if: startsWith(github.ref, 'refs/tags/py-v')
        run: |
          PKG=$(python -c "import tomllib;print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          TAG=${GITHUB_REF_NAME#py-v}
          echo "pyproject=$PKG  tag=$TAG"
          [ "$PKG" = "$TAG" ] || { echo "::error::tag py-v$TAG 与 pyproject $PKG 不一致"; exit 1; }

      - working-directory: python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          # twine check 用的是 PyPI 拒绝上传时的同一套规则，先在这儿红比线上红好
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # ← OIDC 的命门，缺了就换不到凭据
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # 不设任何 token：凭据由 OIDC 现换
      - uses: pypa/gh-action-pypi-publish@release/v1
