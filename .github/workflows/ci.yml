name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor declared in package.json engines — test the floor,
        # not just the latest, or the floor is a claim nobody checks.
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject requires-python.
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q

  # 两个包必须对同一批输入给出同一个答案。各自的单测都只证明"自己跟自己一致"，
  # 只有这一步能抓到"两边各自自洽但互不兼容"——尤其是向量的字节序。
  cross-language:
    needs: [typescript, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile && pnpm build
      - working-directory: python
        run: pip install -e "."
      - name: TypeScript and Python must agree byte for byte
        run: |
          node --input-type=module -e "
            import { encodeVector, estimateTokens, skeletonChapters, resolveThreadDeadline } from './dist/index.js';
            console.log(JSON.stringify({
              v304: encodeVector([3,0,4]),
              v1234: encodeVector([1,2,3,4]),
              tok: estimateTokens('一二三abcd'),
              skel: skeletonChapters(1000, 980),
              dl: resolveThreadDeadline(0, 3, 20),
            }));
          " > ts.json
          python -c "
          import json
          from longform_memory import encode_vector, estimate_tokens, skeleton_chapters, resolve_thread_deadline
          ts = json.load(open('ts.json'))
          py = {
            'v304': encode_vector([3,0,4]),
            'v1234': encode_vector([1,2,3,4]),
            'tok': estimate_tokens('一二三abcd'),
            'skel': skeleton_chapters(1000, 980),
            'dl': resolve_thread_deadline(0, 3, 20),
          }
          for k in ts:
              assert ts[k] == py[k], f'{k}: TS={ts[k]!r} != PY={py[k]!r}'
          print('cross-language OK:', py)
          "
